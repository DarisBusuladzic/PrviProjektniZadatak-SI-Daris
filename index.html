<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Valuta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow p-4 rounded-4">
            <h2 class="text-center mb-4">💱 Konverter Valuta</h2>
            <form id="converter-form">
                <div class="mb-3">
                    <label for="amount" class="form-label">Unesi iznos:</label>
                    <input type="number" class="form-control" id="amount" placeholder="npr. 100" required>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label for="from-currency" class="form-label">Iz valute:</label>
                        <select class="form-select" id="from-currency">
                            <option value="BAM">BAM - Konvertibilna marka</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="USD">USD - Američki dolar</option>
                            <option value="GBP">GBP - Britanska funta</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="to-currency" class="form-label">U valutu:</label>
                        <select class="form-select" id="to-currency">
                            <option value="EUR">EUR - Euro</option>
                            <option value="BAM">BAM - Konvertibilna marka</option>
                            <option value="USD">USD - Američki dolar</option>
                            <option value="GBP">GBP - Britanska funta</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Konvertuj</button>
            </form>

            <div class="result mt-4 text-center">
                <h4 id="result-text"></h4>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
